{% extends 'base.html' %}{% block content %}<div class="panel"><h1>Pay for {{item.title}}</h1><h2>Amount: ₹{{'%.2f'|format(item.price)}}</h2><p>Scan the GPay QR below and pay exactly this amount. Payment is manually verified.</p><img class="qr" src="{{url_for('static',filename='images/gpay-qr.jpeg')}}" alt="GPay QR"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" maxlength="100" required></label><label>Email<input type="email" name="email" maxlength="254" required></label><label>GPay transaction/reference ID<input name="reference" maxlength="100" required></label><button>Submit Payment</button></form></div>{% endblock %}
