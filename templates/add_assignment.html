{% extends 'base.html' %}{% block content %}<div class="panel"><h1>Add assignment</h1><p>Upload the file manually to your private Google Drive assignment folder first, then paste its Drive file ID below.</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Title<input name="title" maxlength="150" required></label><label>Subject<input name="subject" maxlength="100" required></label><label>Description<textarea name="description" maxlength="2000" rows="5"></textarea></label><label>Price (₹)<input name="price" type="number" min="0" max="100000" step="0.01" required></label><label>Google Drive file ID<input name="drive_file_id" maxlength="200" placeholder="1AbC..." required></label><button>Add assignment</button></form></div>{% endblock %}
